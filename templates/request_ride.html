{% extends "base.html" %}
{% block title %}Request a ride - NLNOG Ride Share{% endblock %}
{% block content %}
<h1>Request a ride</h1>
<form method="post" action="/requests/new">
    <label for="direction">
        Direction
        <select id="direction" name="direction">
            <option value="to_event" selected>To the event</option>
            <option value="from_event">From the event</option>
            <option value="round_trip">Both ways</option>
        </select>
    </label>
    <label for="location">
        Which location? <small>(where you travel from or to)</small>
        <input type="text" id="location" name="location" placeholder="e.g. Rotterdam" required>
    </label>
    <label for="departure_time">
        Preferred departure time <small>(optional)</small>
        <input type="datetime-local" id="departure_time" name="departure_time"
               value="{{ event_date ~ 'T08:00' if event_date else '' }}">
    </label>
    <label for="notes">
        Notes <small>(optional)</small>
        <textarea id="notes" name="notes" placeholder="e.g. flexible on time, can chip in for fuel, etc."></textarea>
    </label>
    <label for="contact_phone">
        Your contact: phone / Telegram / Signal
        <input type="text" id="contact_phone" name="contact_phone"
               placeholder="e.g. +31 6 1234 5678 or @telegram_handle"
               value="{{ user.phone or '' }}" required>
        <small>Shared with the driver once you are matched.</small>
    </label>
    <label for="contact_notes">
        Additional contact notes <small>(optional)</small>
        <textarea id="contact_notes" name="contact_notes" placeholder="e.g. reach me on IRC as nick, or on Matrix">{{ user.notes or '' }}</textarea>
    </label>
    <div class="grid">
        <button type="submit">Post request</button>
        <a href="/dashboard" role="button" class="outline">Cancel</a>
    </div>
</form>
{% endblock %}
